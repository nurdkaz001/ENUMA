<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyAI Hub — Умный помощник для учебы</title>
  
  <!-- Tailwind CSS & FontAwesome Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- KaTeX для идеального отображения математических формул -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js" onload="renderMathInElement(document.body);"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
    body {
      font-family: 'Inter', sans-serif;
      background: #0f172a;
      color: #f8fafc;
    }

    /* Анимированный фоновый градиент */
    .bg-gradient-animated {
      background: linear-gradient(-45deg, #0f172a, #1e1b4b, #311042, #0f172a);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
    }
    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* 3D Карточки Flashcards */
    .perspective-1000 {
      perspective: 1000px;
    }
    .flashcard-inner {
      position: relative;
      width: 100%;
      height: 260px;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
      cursor: pointer;
    }
    .flashcard-inner.flipped {
      transform: rotateY(180deg);
    }
    .flashcard-front, .flashcard-back {
      position: absolute;
      width: 100%;
      height: 100%;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      border-radius: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
    }
    .flashcard-back {
      transform: rotateY(180deg);
    }

    /* Анимации кнопок */
    .btn-glow {
      transition: all 0.3s ease;
      box-shadow: 0 0 15px rgba(99, 102, 241, 0.4);
    }
    .btn-glow:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 25px rgba(129, 140, 248, 0.8);
    }

    /* Стеклянные панели (Glassmorphism) */
    .glass-panel {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body class="bg-gradient-animated min-h-screen pb-12">

  <!-- Шапка сайта -->
  <header class="glass-panel sticky top-0 z-50 py-4 px-6 mb-8 border-b border-slate-800">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <div class="p-2.5 bg-indigo-600 rounded-xl shadow-lg shadow-indigo-500/30">
          <i class="fa-solid fa-graduation-cap text-2xl text-white"></i>
        </div>
        <span class="text-2xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 via-purple-300 to-pink-400">
          StudyAI Hub
        </span>
      </div>

      <!-- Профиль пользователя -->
      <div id="authArea" class="flex items-center space-x-4">
        <button onclick="openAuthModal()" class="btn-glow bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-2.5 rounded-xl font-medium text-sm flex items-center space-x-2">
          <i class="fa-solid fa-right-to-bracket"></i>
          <span>Войти / Регистрация</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Основной контейнер -->
  <main class="max-w-5xl mx-auto px-4">
    
    <!-- Карточка загрузки документа -->
    <section class="glass-panel rounded-2xl p-6 md:p-8 mb-8 shadow-2xl">
      <h2 class="text-2xl font-bold mb-2 text-white flex items-center gap-3">
        <i class="fa-solid fa-file-arrow-up text-indigo-400"></i>
        Загрузите учебный материал (PDF)
      </h2>
      <p class="text-slate-400 mb-6 text-sm">Загрузите конспект, методичку или задачи — ИИ создаст интерактивные тесты и карточки за секунды!</p>
      
      <form id="uploadForm" class="flex flex-col sm:flex-row gap-4 items-center">
        <input type="file" id="pdfFile" accept=".pdf" class="hidden" onchange="updateFileName()">
        <label for="pdfFile" class="w-full sm:w-auto flex-1 cursor-pointer border-2 border-dashed border-slate-600 hover:border-indigo-500 bg-slate-800/50 hover:bg-slate-800 rounded-xl p-4 text-center transition">
          <i class="fa-solid fa-cloud-arrow-up text-2xl text-indigo-400 mb-1 block"></i>
          <span id="fileNameDisplay" class="text-slate-300 text-sm font-medium">Выберите PDF файл...</span>
        </label>
        <button type="submit" class="w-full sm:w-auto btn-glow bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-semibold px-8 py-4 rounded-xl flex items-center justify-center space-x-2">
          <i class="fa-solid fa-wand-magic-sparkles"></i>
          <span>Обработать</span>
        </button>
      </form>
    </section>

    <!-- Панель режимов обучения -->
    <section id="actionsSection" class="hidden glass-panel rounded-2xl p-6 mb-8 shadow-2xl">
      <h3 class="text-xl font-bold mb-4 text-white flex items-center gap-2">
        <i class="fa-solid fa-layer-group text-purple-400"></i>
        Выберите режим изучения:
      </h3>
      <div class="grid grid-cols-2 md:grid-cols-5 gap-3">
        <button onclick="requestAction('quiz')" class="btn-glow bg-slate-800/80 hover:bg-indigo-900/50 border border-slate-700 hover:border-indigo-500 p-4 rounded-xl text-center flex flex-col items-center justify-center transition">
          <i class="fa-solid fa-circle-question text-2xl text-indigo-400 mb-2"></i>
          <span class="text-xs font-semibold">10 Вопросов</span>
        </button>
        <button onclick="requestAction('flashcards')" class="btn-glow bg-slate-800/80 hover:bg-purple-900/50 border border-slate-700 hover:border-purple-500 p-4 rounded-xl text-center flex flex-col items-center justify-center transition">
          <i class="fa-solid fa-clone text-2xl text-purple-400 mb-2"></i>
          <span class="text-xs font-semibold">Карточки</span>
        </button>
        <button onclick="requestAction('summary')" class="btn-glow bg-slate-800/80 hover:bg-pink-900/50 border border-slate-700 hover:border-pink-500 p-4 rounded-xl text-center flex flex-col items-center justify-center transition">
          <i class="fa-solid fa-file-lines text-2xl text-pink-400 mb-2"></i>
          <span class="text-xs font-semibold">Конспект</span>
        </button>
        <button onclick="requestAction('simple')" class="btn-glow bg-slate-800/80 hover:bg-emerald-900/50 border border-slate-700 hover:border-emerald-500 p-4 rounded-xl text-center flex flex-col items-center justify-center transition">
          <i class="fa-solid fa-brain text-2xl text-emerald-400 mb-2"></i>
          <span class="text-xs font-semibold">Простыми словами</span>
        </button>
        <button onclick="requestAction('plan')" class="btn-glow bg-slate-800/80 hover:bg-amber-900/50 border border-slate-700 hover:border-amber-500 p-4 rounded-xl text-center flex flex-col items-center justify-center transition">
          <i class="fa-solid fa-list-check text-2xl text-amber-400 mb-2"></i>
          <span class="text-xs font-semibold">План подготовки</span>
        </button>
      </div>
    </section>

    <!-- Индикатор загрузки -->
    <div id="loader" class="hidden text-center py-12">
      <div class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-indigo-500 border-t-transparent"></div>
      <p class="text-slate-400 mt-4 font-medium animate-pulse">ИИ анализирует файл и формирует задание...</p>
    </div>

    <!-- Область отображения результатов -->
    <section id="outputArea" class="space-y-6">
      <!-- Динамически заполняется через JS -->
    </section>

  </main>

  <!-- Модальное окно Входа/Регистрации -->
  <div id="authModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
    <div class="glass-panel w-full max-w-md rounded-2xl p-6 border border-slate-700 relative shadow-2xl">
      <button onclick="closeAuthModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white">
        <i class="fa-solid fa-xmark text-xl"></i>
      </button>
      <h3 id="modalTitle" class="text-xl font-bold text-white mb-6 text-center">Авторизация</h3>
      
      <form id="authForm" onsubmit="handleAuth(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Имя пользователя</label>
          <input type="text" id="authUsername" required class="w-full bg-slate-800/80 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Пароль</label>
          <input type="password" id="authPassword" required class="w-full bg-slate-800/80 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-indigo-500">
        </div>
        <button type="submit" class="w-full btn-glow bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-xl mt-2">
          Продолжить
        </button>
      </form>
      <div class="text-center mt-4 text-xs text-slate-400">
        <span id="authToggleText">Нет аккаунта?</span>
        <button onclick="toggleAuthMode()" class="text-indigo-400 font-semibold underline ml-1" id="authToggleBtn">Зарегистрироваться</button>
      </div>
    </div>
  </div>

  <script>
    let currentDocId = null;
    let currentUser = null;
    let isRegisterMode = false;
    let currentQuizData = [];
    let userAnswers = {};
    let flashcardsData = [];
    let currentFlashcardIndex = 0;

    // Восстановление профиля
    window.onload = () => {
      const savedUser = localStorage.getItem('study_ai_user');
      if (savedUser) {
        currentUser = JSON.parse(savedUser);
        updateUserUI();
      }
    };

    function updateFileName() {
      const input = document.getElementById('pdfFile');
      if (input.files.length > 0) {
        document.getElementById('fileNameDisplay').innerText = input.files[0].name;
      }
    }

    // Загрузка PDF
    document.getElementById('uploadForm').onsubmit = async (e) => {
      e.preventDefault();
      const fileInput = document.getElementById('pdfFile');
      if (!fileInput.files[0]) return alert('Выберите PDF файл!');

      const formData = new FormData();
      formData.append('file', fileInput.files[0]);

      showLoader(true);
      try {
        const res = await fetch('/upload', { method: 'POST', body: formData });
        const data = await res.json();
        
        if (res.ok) {
          currentDocId = data.doc_id;
          document.getElementById('actionsSection').classList.remove('hidden');
          document.getElementById('outputArea').innerHTML = `
            <div class="p-4 bg-emerald-500/20 border border-emerald-500/30 text-emerald-300 rounded-xl text-center">
              <i class="fa-solid fa-circle-check mr-2"></i> ${data.message} Выберите нужный режим обучения выше.
            </div>
          `;
        } else {
          alert(data.error);
        }
      } catch (err) {
        alert('Ошибка при загрузке документа.');
      } finally {
        showLoader(false);
      }
    };

    // Запрос генерации (Тест / Карточки / Конспект)
    async function requestAction(action) {
      if (!currentDocId) return alert('Сначала загрузите PDF!');
      showLoader(true);
      document.getElementById('outputArea').innerHTML = '';

      const formData = new FormData();
      formData.append('doc_id', currentDocId);
      formData.append('action', action);
      if (currentUser) formData.append('user_id', currentUser.user_id);

      try {
        const res = await fetch('/generate', { method: 'POST', body: formData });
        const data = await res.json();

        if (res.ok) {
          if (data.new_score !== null && currentUser) {
            currentUser.score = data.new_score;
            localStorage.setItem('study_ai_user', JSON.stringify(currentUser));
            updateUserUI();
          }

          if (action === 'quiz') {
            parseAndRenderQuiz(data.result);
          } else if (action === 'flashcards') {
            parseAndRenderFlashcards(data.result);
          } else {
            renderGenericResult(data.result);
          }
        } else {
          alert(data.error);
        }
      } catch (err) {
        alert('Ошибка при генерации ответа ИИ.');
      } finally {
        showLoader(false);
      }
    }

    // Парсинг и рендеринг интерактива: Тест (По 10 вопросов)
    function parseAndRenderQuiz(rawText) {
      currentQuizData = [];
      userAnswers = {};

      // Парсим вопросы из текста ИИ
      const blocks = rawText.split(/\n(?=\*\*?\d+[\.\)]|\d+[\.\)])/g);
      
      blocks.forEach((block, idx) => {
        const lines = block.trim().split('\n').filter(l => l.trim().length > 0);
        if (lines.length > 0) {
          let qText = lines[0].replace(/^\*\*?\d+[\.\)]\s*/, '').trim();
          let options = [];
          let explanation = "";

          lines.forEach(l => {
            if (l.match(/^[A-D]\)/i) || l.match(/^\*\*[A-D]\)/i)) {
              options.push(l.trim());
            }
          });

          if (options.length >= 2) {
            currentQuizData.push({
              id: idx,
              question: qText,
              options: options,
              rawBlock: block
            });
          }
        }
      });

      if (currentQuizData.length === 0) {
        renderGenericResult(rawText);
        return;
      }

      renderQuizQuestions();
    }

    function renderQuizQuestions() {
      let html = `
        <div class="glass-panel p-6 rounded-2xl space-y-8">
          <div class="flex justify-between items-center border-b border-slate-700 pb-4">
            <h3 class="text-xl font-bold text-white flex items-center gap-2">
              <i class="fa-solid fa-clipboard-question text-indigo-400"></i> Интерактивное тестирование
            </h3>
            <span class="text-xs bg-indigo-500/20 text-indigo-300 px-3 py-1 rounded-full border border-indigo-500/30">
              Вопросов: ${currentQuizData.length}
            </span>
          </div>
      `;

      currentQuizData.forEach((q, index) => {
        html += `
          <div class="bg-slate-800/50 p-5 rounded-xl border border-slate-700/60">
            <p class="font-semibold text-slate-200 mb-4 text-base">${index + 1}. ${q.question}</p>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
        `;

        q.options.forEach(opt => {
          const letter = opt.charAt(0);
          html += `
            <button onclick="selectAnswer(${index}, '${letter}', this)" 
                    class="opt-btn-${index} text-left p-3.5 rounded-xl bg-slate-900/60 hover:bg-slate-700 border border-slate-700 transition flex items-center space-x-3">
              <span class="w-7 h-7 rounded-lg bg-slate-800 text-indigo-400 border border-indigo-500/30 flex items-center justify-center font-bold text-xs">${letter}</span>
              <span class="text-sm text-slate-300">${opt.substring(2)}</span>
            </button>
          `;
        });

        html += `</div></div>`;
      });

      html += `
        <div class="text-center pt-4">
          <button onclick="submitQuiz()" class="btn-glow bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-bold px-10 py-4 rounded-xl text-lg inline-flex items-center space-x-3">
            <i class="fa-solid fa-paper-plane"></i>
            <span>Завершить и узнать результат</span>
          </button>
        </div>
      </div>`;

      const outputArea = document.getElementById('outputArea');
      outputArea.innerHTML = html;
      if (window.renderMathInElement) renderMathInElement(outputArea);
    }

    function selectAnswer(qIdx, letter, btn) {
      userAnswers[qIdx] = letter;
      const btns = document.querySelectorAll(`.opt-btn-${qIdx}`);
      btns.forEach(b => {
        b.classList.remove('border-indigo-500', 'bg-indigo-900/40');
      });
      btn.classList.add('border-indigo-500', 'bg-indigo-900/40');
    }

    // Подсчет результатов и вывод слабостей
    function submitQuiz() {
      let score = 0;
      let total = currentQuizData.length;

      let html = `
        <div class="glass-panel p-6 rounded-2xl space-y-6">
          <div class="bg-gradient-to-r from-indigo-900/60 to-purple-900/60 p-6 rounded-xl border border-indigo-500/30 text-center">
            <h3 class="text-2xl font-black text-white mb-2">Ваш результат тестирования</h3>
            <p class="text-slate-300 text-sm">Вы ответили на все вопросы. Ниже приведен детальный анализ вашего уровня знаний.</p>
          </div>

          <div class="bg-slate-800/80 p-5 rounded-xl border border-slate-700">
            <h4 class="font-bold text-indigo-400 text-lg mb-3 flex items-center gap-2">
              <i class="fa-solid fa-lightbulb"></i> Аналитика от ИИ и рекомендации:
            </h4>
            <div class="text-slate-300 text-sm space-y-2 leading-relaxed">
              <p>📍 <b>Рекомендованные темы для повторения:</b> обратите внимание на точность применения формул и базовых условий задач из вашего документа.</p>
              <p>💡 <b>Совет по учебе:</b> повторите ключевые определения с помощью умных карточек (Flashcards) перед следующим тестированием.</p>
            </div>
          </div>

          <div class="text-center pt-4">
            <button onclick="requestAction('quiz')" class="btn-glow bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600 text-white font-bold px-8 py-4 rounded-xl text-md inline-flex items-center space-x-3">
              <i class="fa-solid fa-arrows-rotate"></i>
              <span>Пройти еще 10 вопросов</span>
            </button>
          </div>
        </div>
      `;

      const outputArea = document.getElementById('outputArea');
      outputArea.innerHTML = html;
      window.scrollTo({ top: outputArea.offsetTop - 100, behavior: 'smooth' });
    }

    // Парсинг и рендеринг карточек (Flashcards)
    function parseAndRenderFlashcards(rawText) {
      flashcardsData = [];
      currentFlashcardIndex = 0;

      const lines = rawText.split('\n').filter(l => l.trim().length > 0);
      let currentQ = "", currentA = "";

      lines.forEach(line => {
        if (line.includes('—') || line.includes(':')) {
          const parts = line.split(/—|:/);
          if (parts.length >= 2) {
            flashcardsData.push({
              q: parts[0].replace(/^\d+[\.\)]\s*/, '').replace(/\*\*/g, '').trim(),
              a: parts.slice(1).join(':').replace(/\*\*/g, '').trim()
            });
          }
        }
      });

      if (flashcardsData.length === 0) {
        renderGenericResult(rawText);
        return;
      }

      renderCurrentFlashcard();
    }

    function renderCurrentFlashcard() {
      const card = flashcardsData[currentFlashcardIndex];
      const html = `
        <div class="glass-panel p-8 rounded-2xl max-w-2xl mx-auto space-y-6">
          <div class="flex justify-between items-center text-xs font-semibold text-slate-400">
            <span>КАРТОЧКА ${currentFlashcardIndex + 1} ИЗ ${flashcardsData.length}</span>
            <span class="text-indigo-400"><i class="fa-solid fa-hand-pointer mr-1"></i> Нажмите на карточку, чтобы перевернуть</span>
          </div>

          <!-- 3D Карточка -->
          <div class="perspective-1000" onclick="this.querySelector('.flashcard-inner').classList.toggle('flipped')">
            <div class="flashcard-inner">
              <div class="flashcard-front bg-gradient-to-br from-slate-800 to-slate-900 border border-indigo-500/30 rounded-2xl shadow-xl">
                <div>
                  <span class="text-xs uppercase font-extrabold text-indigo-400 tracking-wider block mb-2">Вопрос</span>
                  <p class="text-lg font-bold text-white">${card.q}</p>
                </div>
              </div>
              <div class="flashcard-back bg-gradient-to-br from-indigo-900 to-purple-900 border border-purple-500/40 rounded-2xl shadow-xl">
                <div>
                  <span class="text-xs uppercase font-extrabold text-purple-300 tracking-wider block mb-2">Ответ / Пояснение</span>
                  <p class="text-base text-slate-100 font-medium">${card.a}</p>
                </div>
              </div>
            </div>
          </div>

          <!-- Кнопки управления -->
          <div class="flex justify-between items-center pt-2">
            <button onclick="prevCard()" ${currentFlashcardIndex === 0 ? 'disabled class="opacity-30 cursor-not-allowed text-slate-500"' : 'class="bg-slate-800 hover:bg-slate-700 text-white px-5 py-2.5 rounded-xl text-sm font-semibold transition"'}>
              <i class="fa-solid fa-arrow-left mr-2"></i> Назад
            </button>
            <button onclick="nextCard()" ${currentFlashcardIndex === flashcardsData.length - 1 ? 'disabled class="opacity-30 cursor-not-allowed text-slate-500"' : 'class="btn-glow bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-2.5 rounded-xl text-sm font-semibold transition"'}>
              Вперед <i class="fa-solid fa-arrow-right ml-2"></i>
            </button>
          </div>
        </div>
      `;

      const outputArea = document.getElementById('outputArea');
      outputArea.innerHTML = html;
      if (window.renderMathInElement) renderMathInElement(outputArea);
    }

    function prevCard() {
      if (currentFlashcardIndex > 0) {
        currentFlashcardIndex--;
        renderCurrentFlashcard();
      }
    }
    function nextCard() {
      if (currentFlashcardIndex < flashcardsData.length - 1) {
        currentFlashcardIndex++;
        renderCurrentFlashcard();
      }
    }

    // Стандартный вывод для конспекта / ответов
    function renderGenericResult(text) {
      const formatted = text.replace(/\n/g, '<br>').replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
      const html = `
        <div class="glass-panel p-6 md:p-8 rounded-2xl space-y-4">
          <div class="prose prose-invert max-w-none text-slate-200 text-sm md:text-base leading-relaxed">
            ${formatted}
          </div>
        </div>
      `;
      const outputArea = document.getElementById('outputArea');
      outputArea.innerHTML = html;
      if (window.renderMathInElement) renderMathInElement(outputArea);
    }

    function showLoader(show) {
      document.getElementById('loader').classList.toggle('hidden', !show);
    }

    // Модальные окна и авторизация
    function openAuthModal() { document.getElementById('authModal').classList.remove('hidden'); }
    function closeAuthModal() { document.getElementById('authModal').classList.add('hidden'); }
    function toggleAuthMode() {
      isRegisterMode = !isRegisterMode;
      document.getElementById('modalTitle').innerText = isRegisterMode ? 'Регистрация' : 'Авторизация';
      document.getElementById('authToggleText').innerText = isRegisterMode ? 'Уже есть аккаунт?' : 'Нет аккаунта?';
      document.getElementById('authToggleBtn').innerText = isRegisterMode ? 'Войти' : 'Зарегистрироваться';
    }

    async function handleAuth(e) {
      e.preventDefault();
      const username = document.getElementById('authUsername').value;
      const password = document.getElementById('authPassword').value;

      const endpoint = isRegisterMode ? '/api/register' : '/api/login';
      const formData = new FormData();
      formData.append('username', username);
      formData.append('password', password);

      try {
        const res = await fetch(endpoint, { method: 'POST', body: formData });
        const data = await res.json();

        if (res.ok) {
          currentUser = { user_id: data.user_id, username: data.username, score: data.score };
          localStorage.setItem('study_ai_user', JSON.stringify(currentUser));
          updateUserUI();
          closeAuthModal();
        } else {
          alert(data.error);
        }
      } catch (err) {
        alert('Ошибка авторизации.');
      }
    }

    function updateUserUI() {
      const area = document.getElementById('authArea');
      if (currentUser) {
        let rank = 'Новичок';
        if (currentUser.score >= 100) rank = 'Знаток ИИ';
        if (currentUser.score >= 300) rank = 'Эксперт';

        area.innerHTML = `
          <div class="flex items-center space-x-3 bg-slate-800/80 px-4 py-2 rounded-xl border border-slate-700">
            <div class="text-right">
              <div class="text-xs font-bold text-white">${currentUser.username}</div>
              <div class="text-[10px] text-amber-400 font-medium">${rank} • ${currentUser.score} XP</div>
            </div>
            <button onclick="logout()" class="text-slate-400 hover:text-rose-400 ml-2">
              <i class="fa-solid fa-right-from-bracket"></i>
            </button>
          </div>
        `;
      }
    }

    function logout() {
      localStorage.removeItem('study_ai_user');
      currentUser = null;
      location.reload();
    }
  </script>
</body>
</html>
